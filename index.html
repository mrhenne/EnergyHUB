<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Henne's Energy Hub</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { 
      darkMode: 'class',
      theme: { extend: {} }
    }
  </script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel für JSX Kompilierung im Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Prop-Types (wird von Recharts UMD benötigt) -->
  <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <!-- Recharts (Auf stabile Version 2.12.7 gepinnt, da v3+ im Browser Probleme verursacht) -->
  <script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <style>
    /* Custom Scrollbar für cleanen Look */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    body { -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-[#121212] dark:text-slate-100 transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    // --- WARNUNGEN UNTERDRÜCKEN ---
    // Recharts 2.x nutzt intern noch defaultProps, was in React 18+ zu Warnungen führt.
    // Da wir v3 (welches diese Warnung behebt) im reinen Browser-Build nicht nutzen können, 
    // filtern wir diese spezifische, harmlose Warnung aus der Konsole, um sie sauber zu halten.
    const originalConsoleError = console.error;
    console.error = (...args) => {
      if (typeof args[0] === 'string' && args[0].includes('Support for defaultProps will be removed')) {
        return;
      }
      originalConsoleError(...args);
    };

    const { useState, useMemo, useRef, useEffect } = React;
    const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip: RechartsTooltip, ResponsiveContainer, Legend } = window.Recharts;

    // --- NATIVE ICONS (Garantiert kompatibel ohne Build-Step) ---
    const Icons = {
      Sun: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>,
      Zap: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
      Euro: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 10h12M4 14h9M19 6a7.7 7.7 0 0 0-5.2-2A7.9 7.9 0 0 0 6 12c0 4.4 3.5 8 7.8 8 2 0 3.8-.8 5.2-2"/></svg>,
      Calendar: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
      Settings: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
      ArrowRight: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>,
      Home: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
      Power: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" x2="12" y1="2" y2="12"/></svg>,
      Moon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>,
      Download: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
      Upload: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
      Plus: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>,
      Trash: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>,
      TrendingUp: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>,
      Car: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>,
      Tv: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="15" x="2" y="7" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>,
      Bike: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>,
      ShieldCheck: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 13c0 5-3.5 9-8 10-4.5-1-8-5-8-10V5l8-3 8 3v5Z"/><path d="m9 12 2 2 4-4"/></svg>,
      Leaf: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 22c1.25-.97 2.5-2 3.75-3.5C7.25 17 8.5 15.65 9.75 14.5"/></svg>,
      Target: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
    };

    const Icon = ({ name, size = 24, className = "" }) => {
      const svg = Icons[name];
      if (!svg) return null;
      return React.cloneElement(svg, { width: size, height: size, className });
    };

    // --- SETUP DATEN ---
    const INITIAL_PRODUCERS = ['Garagendach', 'EcoFlow'];
    const INITIAL_DATA = {
      2025: { export: 120, isPartial: false, productions: { Garagendach: 950, EcoFlow: 280 } },
      2026: { export: 33, isPartial: true, productions: { Garagendach: 401, EcoFlow: 131 } }
    };
    const CO2_FACTOR = 0.434;

    function App() {
      // --- STATE ---
      const [darkMode, setDarkMode] = useState(true);
      const [producers, setProducers] = useState(INITIAL_PRODUCERS);
      const [solarData, setSolarData] = useState(INITIAL_DATA);
      const [electricityPrice, setElectricityPrice] = useState(0.28);
      const [hardwareCost, setHardwareCost] = useState(1500);
      const [selectedYear, setSelectedYear] = useState('2026');
      
      const [showAddYearForm, setShowAddYearForm] = useState(false);
      const [showProducerManager, setShowProducerManager] = useState(false);
      const [newProducerName, setNewProducerName] = useState('');
      
      const [newYearForm, setNewYearForm] = useState({
        year: new Date().getFullYear() + 1,
        export: 0,
        isPartial: false,
        productions: INITIAL_PRODUCERS.reduce((acc, curr) => ({ ...acc, [curr]: 0 }), {})
      });

      const fileInputRef = useRef(null);

      // --- DARK MODE LOGIK ---
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      // --- HARDWARE / PRODUZENTEN ---
      const handleAddProducer = (e) => {
        e.preventDefault();
        if (!newProducerName.trim() || producers.includes(newProducerName.trim())) return;
        const name = newProducerName.trim();
        setProducers([...producers, name]);
        
        setSolarData(prev => {
          const newData = { ...prev };
          Object.keys(newData).forEach(year => {
            if(!newData[year].productions) newData[year].productions = {};
            newData[year].productions[name] = 0;
          });
          return newData;
        });
        
        setNewYearForm(prev => ({
          ...prev,
          productions: { ...prev.productions, [name]: 0 }
        }));
        setNewProducerName('');
      };

      const handleRemoveProducer = (producerToRemove) => {
        setProducers(producers.filter(p => p !== producerToRemove));
        setSolarData(prev => {
          const newData = JSON.parse(JSON.stringify(prev));
          Object.keys(newData).forEach(year => {
            delete newData[year].productions[producerToRemove];
          });
          return newData;
        });
      };

      const handleUpdateProduction = (year, producer, value) => {
        setSolarData(prev => ({
          ...prev,
          [year]: {
            ...prev[year],
            productions: {
              ...prev[year].productions,
              [producer]: Number(value)
            }
          }
        }));
      };

      // --- DATEN IM- / EXPORT ---
      const handleExport = () => {
        const dataToExport = { solarData, producers, electricityPrice, hardwareCost };
        const blob = new Blob([JSON.stringify(dataToExport, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `energy_hub_backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImport = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const imported = JSON.parse(e.target.result);
            if (imported.solarData) setSolarData(imported.solarData);
            if (imported.producers) setProducers(imported.producers);
            if (imported.electricityPrice) setElectricityPrice(imported.electricityPrice);
            if (imported.hardwareCost) setHardwareCost(imported.hardwareCost);
          } catch (err) {
            console.error("Fehler beim Import");
          }
        };
        reader.readAsText(file);
      };

      const handleAddYear = (e) => {
        e.preventDefault();
        setSolarData(prev => ({
          ...prev,
          [newYearForm.year]: {
            export: Number(newYearForm.export),
            isPartial: newYearForm.isPartial,
            productions: { ...newYearForm.productions }
          }
        }));
        setSelectedYear(newYearForm.year.toString());
        setShowAddYearForm(false);
      };

      // --- BERECHNUNGEN AKTUELLES JAHR ---
      const currentData = solarData[selectedYear] || { export: 0, isPartial: false, productions: {} };
      
      const totalProduction = useMemo(() => {
        return Object.values(currentData.productions || {}).reduce((sum, val) => sum + (Number(val) || 0), 0);
      }, [currentData]);

      const selfConsumption = totalProduction - currentData.export;
      const savingsEuro = selfConsumption * electricityPrice;
      const exportLossEuro = currentData.export * electricityPrice;
      const efficiencyRate = totalProduction > 0 ? (selfConsumption / totalProduction) * 100 : 0;

      // --- PROGNOSE (Für angefangene Jahre) ---
      const isPartial = currentData.isPartial;
      const seasonalMultiplier = isPartial ? 3.2 : 1; 
      const prognosisProduction = totalProduction * seasonalMultiplier;
      const prognosisSavings = (prognosisProduction * (efficiencyRate/100)) * electricityPrice;

      // --- ROI / AMORTISATION ---
      const globalStats = useMemo(() => {
        let totalSavings = 0;
        let fullYearsCount = 0;
        let totalFullYearSavings = 0;

        Object.values(solarData).forEach(yearData => {
          const prod = Object.values(yearData.productions || {}).reduce((sum, val) => sum + (Number(val) || 0), 0);
          const cons = prod - yearData.export;
          const sav = cons * electricityPrice;
          totalSavings += sav;
          
          if (!yearData.isPartial) {
            fullYearsCount++;
            totalFullYearSavings += sav;
          }
        });

        const avgYearlySavings = fullYearsCount > 0 
          ? (totalFullYearSavings / fullYearsCount) 
          : (totalSavings > 0 ? totalSavings * 2 : 250); // Fallback, falls noch kein volles Jahr existiert

        const remainingCost = Math.max(0, hardwareCost - totalSavings);
        const yearsToAmortize = remainingCost > 0 ? (remainingCost / avgYearlySavings) : 0;
        const currentYearNum = new Date().getFullYear();
        const amortizationYear = currentYearNum + Math.ceil(yearsToAmortize);

        return {
          totalSavings,
          roiPercentage: Math.min((totalSavings / hardwareCost) * 100, 100),
          amortizationYear,
          remainingCost,
          avgYearlySavings
        };
      }, [solarData, electricityPrice, hardwareCost]);

      // --- CHART DATEN ---
      const chartData = Object.keys(solarData).sort().map(year => {
        const d = solarData[year];
        const totalProd = Object.values(d.productions).reduce((a, b) => a + Number(b), 0);
        const consumed = totalProd - d.export;
        
        const dataPoint = { year, Eigenverbrauch: consumed };
        producers.forEach(p => {
          dataPoint[p] = d.productions[p] || 0;
        });
        return dataPoint;
      });

      const COLORS = ['#f59e0b', '#3b82f6', '#8b5cf6', '#ec4899', '#14b8a6'];
      const formatEuro = (val) => `${Number(val).toFixed(2)} €`;
      const formatKwh = (val) => `${Number(val).toFixed(0)} kWh`;

      return (
        <div className="min-h-screen">
          
          {/* TOP HEADER */}
          <div className="bg-[#1a1a1a] border-b border-white/5 text-white pb-4 pt-6 px-4 md:px-8 shadow-md">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
              <div className="flex items-center gap-4">
                <div className="bg-amber-500/20 p-3 rounded-full">
                  <Icon name="Sun" className="text-amber-500" size={28} />
                </div>
                <div>
                  <h1 className="text-2xl font-bold tracking-tight">Henne's Energy Hub</h1>
                  <div className="text-amber-500 text-sm font-semibold flex items-center gap-1 mt-1">
                    <Icon name="Sun" size={14}/> 16°C <span className="text-slate-400 ml-2 font-normal">Sonnig erwartet</span>
                  </div>
                </div>
              </div>

              <div className="flex gap-8 md:gap-16">
                <div>
                  <div className="text-sm text-slate-400 font-medium mb-1 flex items-center gap-1"><Icon name="Euro" size={14}/> Erträge {selectedYear}</div>
                  <div className="text-3xl font-bold text-amber-500">{formatEuro(savingsEuro)}</div>
                </div>
                <div>
                  <div className="text-sm text-slate-400 font-medium mb-1 flex items-center gap-1"><Icon name="Zap" size={14}/> Erzeugung {selectedYear}</div>
                  <div className="text-3xl font-bold text-white">{totalProduction.toFixed(1)} <span className="text-lg text-slate-400">kWh</span></div>
                </div>
                <div className="hidden sm:block">
                  <div className="text-sm text-slate-400 font-medium mb-1 flex items-center gap-1"><Icon name="Home" size={14}/> Verbrauch {selectedYear}</div>
                  <div className="text-3xl font-bold text-emerald-400">{selfConsumption.toFixed(1)} <span className="text-lg text-slate-400">kWh</span></div>
                </div>
              </div>
            </div>
          </div>

          <div className="max-w-7xl mx-auto p-4 md:p-8 space-y-6">
            
            {/* KONTROLLLEISTE */}
            <div className="flex flex-wrap justify-between items-center gap-4 bg-white dark:bg-[#1a1a1a] p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-white/5">
              <div className="flex items-center gap-3">
                <Icon name="Calendar" className="text-blue-500" size={20} />
                <select 
                  className="text-xl font-bold bg-transparent focus:outline-none cursor-pointer dark:text-white"
                  value={selectedYear}
                  onChange={(e) => setSelectedYear(e.target.value)}
                >
                  {Object.keys(solarData).sort().reverse().map(year => (
                    <option key={year} value={year} className="dark:bg-slate-800">{year}</option>
                  ))}
                </select>
                <div className="h-6 w-px bg-slate-300 dark:bg-slate-700 mx-2"></div>
                <button onClick={() => setShowAddYearForm(!showAddYearForm)} className="text-sm font-bold text-slate-500 hover:text-blue-500 transition-colors flex items-center gap-1"><Icon name="Plus" size={16}/> Jahr</button>
                <button onClick={() => setShowProducerManager(!showProducerManager)} className="text-sm font-bold text-slate-500 hover:text-amber-500 transition-colors ml-2 flex items-center gap-1"><Icon name="Settings" size={16}/> Hardware</button>
              </div>

              <div className="flex items-center gap-3">
                <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-lg bg-slate-100 dark:bg-white/5 hover:bg-slate-200 dark:hover:bg-white/10 transition-colors">
                  {darkMode ? <Icon name="Sun" size={18} className="text-amber-400"/> : <Icon name="Moon" size={18} className="text-slate-600"/>}
                </button>
                <button onClick={handleExport} className="p-2 rounded-lg bg-slate-100 dark:bg-white/5 hover:bg-slate-200 dark:hover:bg-white/10 transition-colors" title="Backup speichern"><Icon name="Download" size={18} className="dark:text-slate-300" /></button>
                <button onClick={() => fileInputRef.current?.click()} className="p-2 rounded-lg bg-slate-100 dark:bg-white/5 hover:bg-slate-200 dark:hover:bg-white/10 transition-colors" title="Backup laden"><Icon name="Upload" size={18} className="dark:text-slate-300" /></button>
                <input type="file" ref={fileInputRef} onChange={handleImport} accept=".json" className="hidden" />
                
                <div className="flex items-center gap-2 bg-slate-100 dark:bg-white/5 p-2 rounded-lg px-3">
                  <Icon name="Euro" className="text-slate-500 dark:text-slate-400" size={16} />
                  <input type="number" step="0.01" className="w-14 bg-transparent font-bold focus:outline-none text-right dark:text-white" value={electricityPrice} onChange={(e) => setElectricityPrice(Number(e.target.value))} />
                  <span className="text-xs font-medium text-slate-500">/ kWh</span>
                </div>
              </div>
            </div>

            {/* NEUES JAHR HINZUFÜGEN */}
            {showAddYearForm && (
              <form onSubmit={handleAddYear} className="bg-white dark:bg-[#1a1a1a] p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-white/5 animate-in fade-in slide-in-from-top-4">
                 <h3 className="text-lg font-bold mb-4 flex items-center gap-2 dark:text-white">Neues Jahr anlegen</h3>
                 <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                    <div>
                      <label className="block text-xs text-slate-500 mb-1">Jahr</label>
                      <input required type="number" className="w-full p-2 rounded-lg bg-slate-50 dark:bg-[#121212] border border-slate-200 dark:border-white/10 focus:outline-none dark:text-white" value={newYearForm.year} onChange={e => setNewYearForm({...newYearForm, year: e.target.value})}/>
                    </div>
                    <div>
                      <label className="block text-xs text-slate-500 mb-1">Eingespeist (kWh)</label>
                      <input required type="number" className="w-full p-2 rounded-lg bg-slate-50 dark:bg-[#121212] border border-slate-200 dark:border-white/10 focus:outline-none dark:text-white" value={newYearForm.export} onChange={e => setNewYearForm({...newYearForm, export: e.target.value})}/>
                    </div>
                    <div className="col-span-2 flex items-center gap-2 mt-4 md:mt-0">
                      <input type="checkbox" id="isPartial" checked={newYearForm.isPartial} onChange={e => setNewYearForm({...newYearForm, isPartial: e.target.checked})} className="w-4 h-4 rounded" />
                      <label htmlFor="isPartial" className="text-sm dark:text-white">Unvollständiges Jahr (Aktiviert die Prognose)</label>
                    </div>
                 </div>
                 <button type="submit" className="bg-blue-500 text-white font-bold px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors">Jahr Speichern</button>
              </form>
            )}

            {/* PRODUZENTEN MANAGER */}
            {showProducerManager && (
              <div className="bg-white dark:bg-[#1a1a1a] p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-white/5 animate-in fade-in slide-in-from-top-4">
                <h3 className="text-lg font-bold mb-4 flex items-center gap-2 dark:text-white">
                  <Icon name="Settings" className="text-amber-500" size={20}/> Hardware Setup (Quellen)
                </h3>
                <div className="flex flex-wrap gap-3 mb-6">
                  {producers.map(p => (
                    <div key={p} className="flex items-center gap-2 bg-slate-100 dark:bg-white/5 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-white/10">
                      <span className="font-semibold text-sm dark:text-slate-200">{p}</span>
                      <button onClick={() => handleRemoveProducer(p)} className="text-red-400 hover:text-red-500"><Icon name="Trash" size={14}/></button>
                    </div>
                  ))}
                </div>
                <form onSubmit={handleAddProducer} className="flex items-center gap-3">
                  <input 
                    type="text" placeholder="Neuer Produzent (z.B. Balkonkraftwerk)" 
                    className="flex-1 max-w-sm p-2 rounded-lg bg-slate-50 dark:bg-[#121212] border border-slate-200 dark:border-white/10 focus:outline-none dark:text-white"
                    value={newProducerName} onChange={e => setNewProducerName(e.target.value)}
                  />
                  <button type="submit" className="bg-amber-500 text-[#121212] font-bold px-4 py-2 rounded-lg hover:bg-amber-400 transition-colors flex items-center gap-2">
                    <Icon name="Plus" size={18}/> Hinzufügen
                  </button>
                </form>
              </div>
            )}

            {/* MAIN LAYOUT */}
            <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
              
              <div className="xl:col-span-2 space-y-6">
                
                {/* ENERGIEFLUSS ARCHITEKTUR */}
                <div className="bg-gradient-to-b from-slate-100 to-slate-200 dark:from-[#1a1a1a] dark:to-[#121212] rounded-3xl p-8 border border-slate-300 dark:border-white/5 shadow-inner relative overflow-hidden">
                  <h3 className="text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider text-sm mb-8 flex items-center gap-2"><Icon name="Zap" size={18}/> System Topologie ({selectedYear})</h3>
                  
                  <div className="grid grid-cols-3 gap-y-16 relative z-10">
                    <div className="flex flex-col items-center justify-start text-center">
                      <div className="text-red-500 font-black text-2xl drop-shadow-sm">{currentData.export.toFixed(0)} <span className="text-sm">kWh</span></div>
                      <div className="text-slate-500 dark:text-slate-400 font-medium text-sm mt-1 flex items-center gap-1"><Icon name="ArrowRight" size={14}/> Einspeisung</div>
                      <div className="mt-4 p-4 bg-white dark:bg-white/5 rounded-2xl shadow-sm border border-slate-200 dark:border-white/10"><Icon name="Power" className="text-slate-400" size={28}/></div>
                    </div>

                    <div className="flex flex-col items-center text-center">
                      <div className="text-amber-500 font-black text-3xl drop-shadow-md">{totalProduction.toFixed(0)} <span className="text-lg">kWh</span></div>
                      <div className="text-slate-500 dark:text-slate-400 font-medium text-sm mt-1">Gesamte Erzeugung</div>
                      <div className="mt-4 flex flex-col gap-2 w-full max-w-[200px]">
                        {producers.map((p, idx) => (
                          <div key={p} className="flex justify-between items-center bg-white dark:bg-[#1a1a1a] p-2 px-3 rounded-xl shadow-sm border border-amber-200 dark:border-amber-500/20">
                            <span className="text-xs font-bold dark:text-slate-300 truncate mr-2">{p}</span>
                            <input 
                              type="number" className="w-16 bg-transparent text-right font-black text-amber-600 dark:text-amber-400 focus:outline-none"
                              value={currentData.productions[p] || 0}
                              onChange={(e) => handleUpdateProduction(selectedYear, p, e.target.value)}
                            />
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="flex flex-col items-center justify-start text-center">
                      <div className="text-emerald-500 font-black text-2xl drop-shadow-sm">{selfConsumption.toFixed(0)} <span className="text-sm">kWh</span></div>
                      <div className="text-slate-500 dark:text-slate-400 font-medium text-sm mt-1 flex items-center gap-1"><Icon name="Home" size={14}/> Hausnetz</div>
                      <div className="mt-4 p-5 bg-white dark:bg-emerald-900/20 rounded-2xl shadow-sm border border-slate-200 dark:border-emerald-500/30"><Icon name="Home" className="text-emerald-500" size={32}/></div>
                    </div>
                  </div>
                </div>

                {/* PROGNOSE & ROI SECTION */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  
                  {/* PROGNOSE */}
                  <div className={`p-6 rounded-2xl shadow-sm border relative overflow-hidden ${isPartial ? 'bg-indigo-50 dark:bg-indigo-900/20 border-indigo-200 dark:border-indigo-500/30' : 'bg-white dark:bg-[#1a1a1a] border-slate-200 dark:border-white/5'}`}>
                    <h3 className="text-lg font-black mb-4 flex items-center gap-2 dark:text-white">
                      <Icon name="Target" className="text-indigo-500" size={20}/> Jahresendprognose
                    </h3>
                    {isPartial ? (
                      <div className="space-y-4 relative z-10">
                        <p className="text-slate-600 dark:text-slate-400 text-sm">Hochrechnung für Silvester {selectedYear} basierend auf aktuellen Daten.</p>
                        <div>
                          <div className="text-3xl font-black text-amber-500">{formatKwh(prognosisProduction)}</div>
                          <div className="text-sm text-slate-500 dark:text-slate-400">Erwarteter Gesamtertrag</div>
                        </div>
                        <div className="pt-4 border-t border-indigo-200 dark:border-indigo-500/20">
                          <div className="text-2xl font-bold text-emerald-500">{formatEuro(prognosisSavings)}</div>
                          <div className="text-sm text-slate-500 dark:text-slate-400">Erwartete Ersparnis</div>
                        </div>
                      </div>
                    ) : (
                      <div className="flex flex-col items-center justify-center h-32 text-center text-slate-400">
                        <p>Das Jahr {selectedYear} ist abgeschlossen.<br/>Keine Prognose notwendig.</p>
                      </div>
                    )}
                  </div>

                  {/* ROI TRACKER */}
                  <div className="bg-slate-900 dark:bg-slate-950 text-white rounded-2xl shadow-xl border border-slate-800 p-6 relative overflow-hidden">
                    <h3 className="text-lg font-black mb-4 text-emerald-400 flex items-center gap-2">
                      <Icon name="TrendingUp" size={20}/> Amortisation (ROI)
                    </h3>
                    
                    <div className="space-y-5 relative z-10">
                      <div className="flex justify-between items-center bg-slate-800/50 p-2 px-3 rounded-xl border border-slate-700/50">
                        <span className="text-slate-400 font-medium text-sm">Hardware Kosten</span>
                        <div className="flex items-center">
                          <input 
                            type="number" className="w-20 text-right bg-transparent border-b border-slate-600 focus:border-emerald-400 focus:outline-none font-bold text-white"
                            value={hardwareCost} onChange={(e) => setHardwareCost(Number(e.target.value))}
                          /> <span className="ml-1 text-slate-400">€</span>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div className="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50">
                          <div className="text-xs text-slate-400 mb-1">Gespart</div>
                          <div className="text-xl font-black text-emerald-400">{formatEuro(globalStats.totalSavings)}</div>
                        </div>
                        <div className="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50">
                          <div className="text-xs text-slate-400 mb-1">Noch Offen</div>
                          <div className="text-xl font-black text-amber-400">{formatEuro(globalStats.remainingCost)}</div>
                        </div>
                      </div>

                      <div>
                        <div className="flex justify-between text-xs mb-1 font-bold">
                          <span className="text-slate-400">ROI Fortschritt</span>
                          <span className="text-emerald-400">{globalStats.roiPercentage.toFixed(1)}%</span>
                        </div>
                        <div className="w-full bg-slate-800 rounded-full h-3 overflow-hidden border border-slate-700">
                          <div className="bg-emerald-500 h-3 rounded-full transition-all duration-1000" style={{ width: `${globalStats.roiPercentage}%` }}></div>
                        </div>
                      </div>

                      <div className="pt-3 border-t border-slate-800 text-center">
                        <div className="text-slate-400 font-medium text-xs">Anlage ist abbezahlt im Jahr</div>
                        <div className="text-2xl font-black text-white mt-1">
                          {globalStats.roiPercentage >= 100 ? 'Bereits abbezahlt! 🎉' : globalStats.amortizationYear}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* CHART */}
                <div className="bg-white dark:bg-[#1a1a1a] rounded-2xl shadow-sm border border-slate-200 dark:border-white/5 p-6">
                  <h3 className="text-lg font-black mb-6 flex items-center gap-2 dark:text-white">
                    <Icon name="TrendingUp" className="text-blue-500" size={20}/>
                    Wachstum & Setup Vergleich
                  </h3>
                  <div className="h-72 w-full">
                    <ResponsiveContainer width="100%" height="100%">
                      <BarChart data={chartData} margin={{ top: 20, right: 0, left: -20, bottom: 0 }}>
                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke={darkMode ? '#333' : '#e2e8f0'} />
                        <XAxis dataKey="year" axisLine={false} tickLine={false} tick={{fill: darkMode ? '#9ca3af' : '#64748b', fontWeight: 'bold'}} />
                        <YAxis axisLine={false} tickLine={false} tickFormatter={(val) => `${val} kWh`} tick={{fill: darkMode ? '#9ca3af' : '#64748b'}} />
                        <RechartsTooltip 
                          cursor={{fill: darkMode ? '#222' : '#f8fafc'}}
                          contentStyle={{backgroundColor: darkMode ? '#111' : '#fff', border: darkMode ? '1px solid #333' : 'none', borderRadius: '12px', color: darkMode ? '#fff' : '#000', fontWeight: 'bold'}}
                        />
                        <Legend iconType="circle" wrapperStyle={{fontWeight: 'bold', paddingTop: '10px'}}/>
                        
                        {producers.map((p, idx) => (
                          <Bar key={p} dataKey={p} stackId="a" fill={COLORS[idx % COLORS.length]} radius={idx === 0 ? [0,0,4,4] : [0,0,0,0]} />
                        ))}
                        
                        <Bar dataKey="Eigenverbrauch" fill="#10b981" radius={[4, 4, 0, 0]} />
                      </BarChart>
                    </ResponsiveContainer>
                  </div>
                </div>

              </div>

              {/* RIGHT COLUMN: Fun Facts & Stats */}
              <div className="space-y-6">
                
                {/* REAL LIFE IMPACT */}
                <div className="bg-gradient-to-br from-indigo-500 to-blue-600 rounded-2xl shadow-xl p-6 text-white relative overflow-hidden">
                  <div className="absolute top-0 right-0 p-4 opacity-10"><Icon name="Zap" size={100} /></div>
                  <h3 className="text-xl font-black mb-1 relative z-10 flex items-center gap-2"><Icon name="Car" size={20}/> Real Life Impact</h3>
                  <p className="text-blue-100 text-sm mb-6 relative z-10">Was deine {totalProduction.toFixed(0)} kWh antreiben.</p>
                  
                  <div className="space-y-4 relative z-10">
                    <div className="bg-white/10 p-3 rounded-xl flex items-center justify-between backdrop-blur-sm border border-white/20">
                      <div className="flex items-center gap-3">
                        <div className="bg-white/20 p-2 rounded-lg"><Icon name="Car" size={20}/></div>
                        <span className="font-medium">Tesla Model 3</span>
                      </div>
                      <div className="font-black text-xl text-right">
                        {((totalProduction / 15) * 100).toFixed(0)} <span className="text-sm font-normal text-blue-200">km</span>
                      </div>
                    </div>

                    <div className="bg-white/10 p-3 rounded-xl flex items-center justify-between backdrop-blur-sm border border-white/20">
                      <div className="flex items-center gap-3">
                        <div className="bg-white/20 p-2 rounded-lg"><Icon name="Tv" size={20}/></div>
                        <span className="font-medium">Netflix Stream</span>
                      </div>
                      <div className="font-black text-xl text-right">
                        {(totalProduction / 0.1).toFixed(0)} <span className="text-sm font-normal text-blue-200">h</span>
                      </div>
                    </div>

                    <div className="bg-white/10 p-3 rounded-xl flex items-center justify-between backdrop-blur-sm border border-white/20">
                      <div className="flex items-center gap-3">
                        <div className="bg-white/20 p-2 rounded-lg"><Icon name="Bike" size={20}/></div>
                        <span className="font-medium">E-Bike Akku</span>
                      </div>
                      <div className="font-black text-xl text-right">
                        {(totalProduction / 0.5).toFixed(0)} <span className="text-sm font-normal text-blue-200">Lad.</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* QUICK STATS */}
                <div className="grid grid-cols-2 gap-4">
                  <div className="bg-white dark:bg-[#1a1a1a] p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-white/5 text-center">
                    <Icon name="Leaf" className="mx-auto text-emerald-500 mb-2" size={24} />
                    <div className="text-xl font-black dark:text-white">{(totalProduction * CO2_FACTOR).toFixed(0)} kg</div>
                    <div className="text-xs text-slate-500 dark:text-slate-400 mt-1 font-semibold">CO2 Ersparnis</div>
                  </div>
                  <div className="bg-white dark:bg-[#1a1a1a] p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-white/5 text-center">
                    <Icon name="ShieldCheck" className="mx-auto text-blue-500 mb-2" size={24} />
                    <div className="text-xl font-black dark:text-white">{efficiencyRate.toFixed(1)}%</div>
                    <div className="text-xs text-slate-500 dark:text-slate-400 mt-1 font-semibold">Effizienzgrad</div>
                  </div>
                </div>

              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
